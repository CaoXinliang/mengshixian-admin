<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜企业审核</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
  <link rel="stylesheet" href="admin-business-review.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active" data-panel="businesses">
        <div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>企业</th><th>联系人</th><th>提交时间</th><th>状态</th><th class="col-action">操作</th></tr></thead><tbody id="businessApplicationsTable"></tbody></table></div>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <dialog id="businessReviewDialog" class="business-review-dialog" aria-labelledby="businessReviewTitle">
    <div class="business-review-head"><h2 id="businessReviewTitle">核对企业申请</h2><button type="button" id="businessReviewClose" aria-label="关闭核对">×</button></div>
    <p id="businessReviewStatus" role="status" aria-live="polite">正在读取申请资料…</p>
    <dl id="businessReviewFields" class="business-review-fields"></dl>
    <div class="business-review-evidence">
      <section><h3>门头照片</h3><img id="businessStorefrontImage" alt="申请人上传的门头照片"><p id="businessStorefrontStatus">等待预览</p></section>
      <section><h3>营业执照</h3><img id="businessLicenseImage" alt="申请人上传的营业执照"><p id="businessLicenseStatus">等待预览</p></section>
    </div>
    <label class="business-review-confirm"><input id="businessReviewConfirmed" type="checkbox">我已对照申请资料，核对两张图片的实际内容</label>
    <div class="business-review-actions"><button type="button" data-business-decision="rejected" disabled>驳回申请</button><button type="button" class="primary" data-business-decision="approved" disabled>确认通过</button></div>
  </dialog>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function(){
      const api = window.MengshixianAdminApi;
      if (!api || !api.getToken()) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'businesses';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="admin-operations-confirm.js"></script>
  <script src="admin-business-review.js"></script>
  <script src="app.js"></script>
</body>
</html>
