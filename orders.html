<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜订单履约</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
  <link rel="stylesheet" href="admin-domain-pages.css">
  <link rel="stylesheet" href="admin-order-guide.css">
  <link rel="stylesheet" href="admin-order-receipts.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active domain-panel" data-panel="orders">
        <div class="domain-panel-head"><div><h3>订单处理</h3><p>先看下方待办，再按状态找订单。每条订单的下一步会写在列表里。</p></div><span class="domain-context">状态以最新加载结果为准</span></div>
        <section class="order-guide" aria-label="订单待办引导"><div class="order-guide-heading"><h4>现在先处理</h4><p id="orderGuideMessage" role="status" aria-live="polite">正在读取订单…</p></div><div class="order-guide-cards" id="orderGuideCards"></div></section>
        <div class="filter-bar"><input id="orderFilterKeyword" aria-label="搜索订单号或收货人" placeholder="订单号或收货人"><select id="orderFilterStatus" aria-label="订单状态"><option value="">全部状态</option><option value="pending_payment">待支付</option><option value="pending_confirmation">待确认</option><option value="picking">拣货中</option><option value="shipping">运输中</option><option value="delivered">已送达</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select><button id="orderFilterBtn" class="primary" type="button">筛选</button><button id="orderFilterReset" type="button">重置</button></div>
        <p class="order-guide-filter-hint" id="orderGuideFilterHint" role="status"></p>
        <div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>订单号</th><th>收货人</th><th>状态</th><th>金额</th><th>支付</th><th>创建时间</th><th class="col-action">下一步</th></tr></thead><tbody id="ordersTable"></tbody></table></div>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function(){
      const api = window.MengshixianAdminApi;
      if (!api || !api.getToken()) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'orders';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="admin-order-guide.js"></script>
  <script src="admin-operations-confirm.js"></script>
  <script src="admin-money.js"></script>
  <script src="admin-order-receipts.js"></script>
  <script src="app.js"></script>
</body>
</html>
