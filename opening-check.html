<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜开店检查</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
  <link rel="stylesheet" href="admin-opening-check.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active" data-panel="openingCheck">
        <div class="opening-check-intro"><h3>先检查营业基础资料</h3><p id="openingCheckStatus" role="status" aria-live="polite">正在读取开店条件。</p><button id="openingCheckReload" class="opening-check-reload" type="button">重新检查</button></div>
        <ul id="openingCheckItems" class="opening-check-list" aria-label="开店基础资料"></ul>
        <section class="opening-check-payment" aria-labelledby="openingPaymentTitle"><h3 id="openingPaymentTitle">收款与下单验收</h3><p id="openingCheckPayment"></p></section>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true"><div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>(function(){ const api = window.MengshixianAdminApi; if (!api || !api.getToken()) window.location.replace('login.html'); })();</script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'openingCheck';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="app.js"></script>
  <script src="admin-opening-check.js"></script>
</body>
</html>
