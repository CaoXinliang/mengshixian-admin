<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜素材库</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active" data-panel="media">
        <input id="mediaSearch" placeholder="按素材名称筛选…" style="width:100%;max-width:280px;padding:6px 10px;margin:0 0 8px;border:1px solid #c9d6e8;border-radius:6px;">
        <div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>素材</th><th>类型</th><th>来源</th><th>版本</th><th>文件状态</th><th class="col-action">操作</th></tr></thead><tbody id="mediaTable"></tbody></table></div>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <dialog id="mediaPreviewDialog"><button type="button" data-preview-close>关闭预览</button><div data-preview-content></div></dialog>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function(){
      const api = window.MengshixianAdminApi;
      if (!api || !api.getToken()) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'media';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="admin-media-guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
