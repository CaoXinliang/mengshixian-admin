<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜素材库</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
  <link rel="stylesheet" href="admin-media-library.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active" data-panel="media">
        <div class="media-intro"><div><p class="eyebrow">素材 · 当前任务</p><h2>先上传，再确认用途</h2><p>文件先进入素材库；预览确认后，再到商品核对页按名称选择并关联。更换文件会保留旧版本。</p></div><a href="product-review.html">去关联商品 →</a></div>
        <div class="media-steps" aria-label="素材使用顺序"><span><b>01</b> 上传文件</span><span><b>02</b> 预览与核对资料</span><span><b>03</b> 关联商品或首页</span></div>
        <div class="media-library"><div class="media-search"><label for="mediaSearch">查找已上传素材</label><input id="mediaSearch" type="search" placeholder="输入素材名称" autocomplete="off"><small>文件名只帮助查找，不能自动决定商品归属。</small></div><div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>素材</th><th>类型</th><th>来源</th><th>版本</th><th>文件状态</th><th class="col-action">操作</th></tr></thead><tbody id="mediaTable"></tbody></table></div></div>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <dialog id="mediaPreviewDialog"><button type="button" data-preview-close>关闭预览</button><div data-preview-content></div></dialog>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function(){
      const api = window.MengshixianAdminApi;
      if (!api || !api.getToken()) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'media';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="admin-media-guide.js"></script>
  <script src="admin-media-metadata.js"></script>
  <script src="app.js"></script>
</body>
</html>
