<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜商品管理</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
  <link rel="stylesheet" href="admin-domain-pages.css">
  <link rel="stylesheet" href="admin-product-list.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active domain-panel" data-panel="products">
        <div class="domain-panel-head"><div><h3>商品资料</h3><p>先查找商品，再进入分步骤编辑；专业规格与媒体关联保留在下方标签。</p></div><span class="domain-context">数据来自当前后台</span></div>
        <nav class="panel-tabs panel-tabs-inner">
          <button data-tab="prod-list" class="is-active">商品列表</button>
          <button data-tab="prod-skus">SKU 规格</button>
          <button data-tab="prod-media">商品媒体关联</button>
        </nav>
        <div class="panel-tab-content is-active" data-tab-content="prod-list">
          <div class="product-list-guide"><label>查找商品<input id="productKeyword" type="search" placeholder="输入商品名称或分类"></label><a href="product-workflow.html">+ 新增商品</a></div>
          <div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>商品</th><th>分类</th><th>温层</th><th>状态</th><th class="col-action">操作</th></tr></thead><tbody id="productsTable"></tbody></table></div>
        </div>
        <div class="panel-tab-content" data-tab-content="prod-skus">
          <div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>SKU 规格</th><th>包装单位</th><th>关联商品</th><th>状态</th><th class="col-action">操作</th></tr></thead><tbody id="skusTable"></tbody></table></div>
        </div>
        <div class="panel-tab-content" data-tab-content="prod-media">
          <div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>商品媒体</th><th>素材名称</th><th>类型</th><th>角色</th><th>状态</th><th class="col-action">操作</th></tr></thead><tbody id="productMediaTable"></tbody></table></div>
        </div>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function(){
      const api = window.MengshixianAdminApi;
      if (!api || !api.getToken()) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'products';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="admin-operations-confirm.js"></script>
  <script src="admin-product-form-guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
