<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜运营管理后台</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
  <link rel="stylesheet" href="admin-overview.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active" data-panel="overview">
        <div class="overview-intro"><div><p class="eyebrow">运营工作台</p><h1>先处理今天要紧的事</h1><p>只显示本次接口查到的事项；首次营业请先做<a href="opening-check.html">开店检查</a>。</p></div><time id="overviewDate"></time></div>
        <div class="task-grid" id="taskMetrics" aria-label="重点待办状态"></div>
        <div class="overview-layout">
          <section class="overview-section overview-daily" aria-labelledby="quickLinksTitle"><div class="overview-section-head"><div><p class="eyebrow">日常路径</p><h2 id="quickLinksTitle">接下来做什么</h2></div></div><div class="overview-shortcuts"><a href="imports.html"><span>01 · 商品</span><strong>导入与补齐资料</strong><small>表格先存草稿，上架前逐件核对</small></a><a href="orders.html"><span>02 · 订单</span><strong>履约与登记收款</strong><small>配送与收款分别处理</small></a><a href="media.html"><span>03 · 素材</span><strong>上传、预览、关联</strong><small>先入库，再选择商品用途</small></a><a href="opening-check.html"><span>04 · 配送</span><strong>检查开店条件</strong><small>区域、时段、运费与仓库</small></a></div></section>
          <section class="overview-section overview-queue" aria-labelledby="queueTitle"><div class="overview-section-head"><div><p class="eyebrow">当前记录</p><h2 id="queueTitle">今日待办</h2></div><a href="audit.html">操作记录</a></div><div id="overviewQueue" class="overview-queue-list" aria-live="polite"></div><p class="overview-queue-limit">上传失败尚无统一任务接口；请在素材上传页查看本次失败提示。</p></section>
        </div>
        <details class="overview-secondary"><summary>查看最近订单与数据概览</summary><section class="overview-section" aria-labelledby="recentOrdersTitle"><div class="overview-section-head"><h2 id="recentOrdersTitle">最近订单</h2><a href="orders.html">查看订单</a></div><div class="table-wrap"><table><thead><tr><th>订单号</th><th>收货人</th><th>金额</th><th>状态</th><th>下单时间</th></tr></thead><tbody id="overviewOrders"></tbody></table></div></section><p class="overview-caption">以下只统计本次成功读取的记录，不能当作全店报表。</p><div class="metric-grid" id="metrics"></div></details>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function(){
      const api = window.MengshixianAdminApi;
      if (!api || !api.getToken()) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'overview';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-overview.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="app.js"></script>
</body>
</html>
