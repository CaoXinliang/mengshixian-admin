<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜运营管理后台</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
  <link rel="stylesheet" href="admin-overview.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active" data-panel="overview">
        <div class="overview-intro"><div><h3>今天的经营事项，都在这里</h3><p>待办和业务记录直接进入对应页面处理。</p></div><time id="overviewDate"></time></div>
        <div class="task-grid" id="taskMetrics"></div>
        <div class="overview-layout">
          <section class="overview-section" aria-labelledby="recentOrdersTitle"><div class="overview-section-head"><h3 id="recentOrdersTitle">最近订单</h3><a href="orders.html">查看订单</a></div><div class="table-wrap"><table><thead><tr><th>订单号</th><th>收货人</th><th>金额</th><th>状态</th><th>下单时间</th></tr></thead><tbody id="overviewOrders"></tbody></table></div></section>
          <section class="overview-section overview-queue" aria-labelledby="queueTitle"><div class="overview-section-head"><h3 id="queueTitle">待处理队列</h3><a href="audit.html">操作记录</a></div><div id="overviewQueue" class="overview-queue-list"></div></section>
        </div>
        <section class="overview-section" aria-labelledby="quickLinksTitle"><div class="overview-section-head"><h3 id="quickLinksTitle">常用入口</h3></div><div class="overview-shortcuts"><a href="products.html">管理商品</a><a href="inventory.html">核对库存</a><a href="banners.html">管理轮播图</a><a href="businesses.html">审核企业</a></div></section>
        <h3 class="section-title" style="margin-top:24px">当前加载的数据</h3>
        <p class="overview-caption">以下数字来自本次后台接口加载的记录，刷新页面可重新核对。</p>
        <div class="metric-grid" id="metrics"></div>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function(){
      const api = window.MengshixianAdminApi;
      if (!api || !api.getToken()) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'overview';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-overview.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="app.js"></script>
</body>
</html>
