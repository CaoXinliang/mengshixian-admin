<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜退款售后</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
  <link rel="stylesheet" href="admin-domain-pages.css">
  <link rel="stylesheet" href="admin-order-guide.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active domain-panel" data-panel="refunds">
        <div class="domain-panel-head"><div><h3>退款处理</h3><p>先审核新申请，再跟进处理中的退款。审核通过不代表款项已经退回。</p></div><span class="domain-context">到账结果以服务端确认为准</span></div>
        <section class="order-guide" aria-label="退款待办引导"><div class="order-guide-heading"><h4>现在先处理</h4><p id="refundGuideMessage" role="status" aria-live="polite">正在读取退款申请…</p></div><div class="order-guide-cards" id="refundGuideCards"></div></section>
        <div class="filter-bar"><label class="order-guide-filter-label" for="refundGuideStatus">查看哪类退款</label><select id="refundGuideStatus"><option value="">全部退款</option><option value="requested">待审核</option><option value="processing">退款处理中</option><option value="reviewing">审核中</option><option value="succeeded">已退款</option><option value="rejected">已驳回</option></select></div>
        <p class="order-guide-filter-hint" id="refundGuideFilterHint" role="status"></p>
        <div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>退款单号</th><th>关联订单</th><th>申请金额</th><th>申请原因</th><th>当前状态</th><th class="col-action">下一步</th></tr></thead><tbody id="refundsTable"></tbody></table></div>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function(){
      const api = window.MengshixianAdminApi;
      if (!api || !api.getToken()) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'refunds';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="admin-order-guide.js"></script>
  <script src="admin-operations-confirm.js"></script>
  <script src="app.js"></script>
</body>
</html>
