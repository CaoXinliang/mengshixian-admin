<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active" data-panel="freight">
        <div class="delivery-task"><div><p class="eyebrow">配送 · 第三步</p><h2>核对运费与免运条件</h2><p>按区域、仓库和适用顾客核对规则；金额用“元”展示，最终运费由服务端计算。</p></div><aside><strong>保存前检查</strong><span>确认规则适用对象与生效时间；已有规则不代表该地区一定能下单。</span><a href="opening-check.html">查看开店检查 →</a></aside></div>
        <h3 class="delivery-records-title">已设置的运费规则</h3>
        <div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>运费规则</th><th>区域</th><th>基础费</th><th>状态</th><th class="col-action">操作</th></tr></thead><tbody id="freightRulesTable"></tbody></table></div>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>

      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
