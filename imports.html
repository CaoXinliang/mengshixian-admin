<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜批量导入</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-shell.css">
  <link rel="stylesheet" href="admin-page-summary.css">
  <link rel="stylesheet" href="admin-import-workflow.css">
</head>
<body>
  <main class="admin-shell" id="adminShell">
    <aside class="sidebar" id="adminSidebar"></aside>
    <section class="workspace">
      <header class="workspace-head" id="adminHeader"></header>
      <p class="notice" id="globalMessage" aria-live="polite"></p>
      <section class="panel is-active" data-panel="imports">
        <div class="section-head"><div><h3>导入商品资料</h3><p>先建立编码对应关系，再补齐资料、核对发布。名称给人看，商品编码与规格编码用于关联；不使用文件名或名称识别商品。</p></div></div>
        <div class="import-steps"><span>1 填商品资料；编码可留空</span><span>2 选择 Excel 或 CSV 表格</span><span>3 逐行核对编码和关联</span><span>4 仅保存待补齐草稿</span><span>5 到商品核对页确认发布</span></div>
        <div class="import-actions"><button type="button" id="downloadImportTemplate">下载 Excel 空白模板</button><a href="outputs/01a0cd53-41af-7eb2-824f-c1e8b42fa25d/商品导入测试演示_仅本地.xlsx" download>下载测试演示表</a><label class="upload-label">选择已填好的表格<input type="file" id="stagingFile" accept=".xlsx,.csv"></label><small>支持 .xlsx、.csv。编码中的前导零请在 Excel 中按文本保存；测试演示表含 TEST 编码，仅用于本地验证，不要导入友方云。</small><a href="product-review.html">去商品核对页 →</a></div>
        <div class="import-preview" id="importMapping" hidden></div>
        <div class="import-preview" id="importPreview" hidden><h4>导入前逐行核对</h4><p id="importPreviewSummary"></p><div class="table-wrap"><table><thead><tr><th>表格行</th><th>商品编码</th><th>规格编码</th><th>商品名称</th><th>分类</th><th>规格</th><th>包装单位</th><th>检查结果</th></tr></thead><tbody id="importPreviewRows"></tbody></table></div><button type="button" class="primary-action" id="saveImportDrafts" disabled>确认仅保存草稿</button></div>
        <h3>已保存的待审核草稿</h3>
        <div class="table-wrap"><table><thead><tr><th class="col-idx">序号</th><th>来源行</th><th>商品</th><th>分类</th><th>规格</th><th>状态</th><th class="col-action">操作</th></tr></thead><tbody id="importsTable"></tbody></table></div>
      </section>
      <div class="hidden-forms"></div>
    </section>
  </main>
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header"><h3 id="modalTitle">表单</h3><button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    (function(){
      const api = window.MengshixianAdminApi;
      if (!api || !api.getToken()) {
        window.location.replace('login.html');
      }
    })();
  </script>
  <script src="paging.js"></script>
  <script>window.PAGE_NAME = 'imports';</script>
  <script src="admin-page-registry.js"></script>
  <script src="admin-forms.js"></script>
  <script src="admin-shell.js"></script>
  <script src="admin-tables.js"></script>
  <script src="admin-page-summary.js"></script>
  <script src="admin-import-parser.js"></script>
  <script src="admin-import-mapping.js"></script>
  <script src="admin-import-workflow.js"></script>
  <script src="admin-operations-confirm.js"></script>
  <script src="app.js"></script>
</body>
</html>
