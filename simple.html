<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>梦食鲜｜简单后台</title>
  <style>
    :root { --blue:#1663d9; --blue-dark:#0d4dad; --bg:#f2f6fc; --card:#ffffff; --line:#dfe8f5; --text:#1c2b3a; --muted:#64748b; --green:#0f8a43; --red:#c93030; --orange:#b45309; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
    button { font:inherit; cursor:pointer; transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease; }
    button:active { transform:translateY(1px); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid rgba(22,99,217,.24); outline-offset:2px; }
    header.top { background:var(--blue); color:#fff; padding:12px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:20; }
    header.top .brand { font-size:19px; font-weight:700; }
    header.top .who { font-size:13px; opacity:.9; }
    header.top .spacer { flex:1; }
    header.top a, header.top button.linkish { color:#fff; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.45); border-radius:8px; padding:6px 12px; font-size:14px; text-decoration:none; }
    nav.tabs { display:flex; gap:8px; padding:12px 18px 0; flex-wrap:wrap; max-width:1080px; margin:0 auto; }
    nav.tabs button { border:1px solid var(--line); background:#fff; border-radius:10px 10px 0 0; padding:12px 18px; font-size:16px; color:var(--muted); border-bottom:none; }
    nav.tabs button.is-active { color:var(--blue-dark); font-weight:700; background:var(--card); box-shadow:0 -2px 0 var(--blue) inset; }
    main.wrap { max-width:1080px; margin:0 auto; padding:0 18px 60px; }
    section.view { display:none; background:var(--card); border:1px solid var(--line); border-radius:0 12px 12px 12px; padding:16px; }
    section.view.is-active { display:block; }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .toolbar input[type=search] { flex:1; min-width:200px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:16px; }
    .toolbar button.refresh { padding:10px 14px; border:1px solid var(--line); background:#fff; border-radius:8px; }
    .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .chips button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font-size:15px; color:var(--muted); }
    .chips button.is-active { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
    .stat-card { border:1px solid var(--line); border-radius:12px; padding:18px; cursor:pointer; background:#fbfdff; }
    .stat-card:hover { border-color:var(--blue); }
    .stat-card .num { font-size:34px; font-weight:800; color:var(--blue-dark); }
    .stat-card .num.alert { color:var(--red); }
    .stat-card .label { color:var(--muted); margin-top:4px; }
    .card-list { display:flex; flex-direction:column; gap:12px; }
    .oc { border:1px solid var(--line); border-radius:12px; padding:14px; }
    .oc .row1 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .oc .money { font-size:20px; font-weight:800; color:var(--red); }
    .oc .meta { color:var(--muted); font-size:14px; margin:6px 0; line-height:1.6; }
    .oc .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
    .badge { border-radius:999px; padding:3px 12px; font-size:13px; font-weight:600; }
    .badge.b-blue { background:#e3edfd; color:var(--blue-dark); }
    .badge.b-green { background:#e2f5e9; color:var(--green); }
    .badge.b-gray { background:#eef1f5; color:var(--muted); }
    .badge.b-red { background:#fdeaea; color:var(--red); }
    .badge.b-orange { background:#fdf3e3; color:var(--orange); }
    button.act { border:none; border-radius:8px; padding:10px 16px; font-size:15px; font-weight:600; background:var(--blue); color:#fff; }
    button.act:hover { background:var(--blue-dark); }
    button.act.green { background:var(--green); }
    button.act.plain { background:#fff; color:var(--text); border:1px solid var(--line); font-weight:500; }
    button.act.danger { background:#fff; color:var(--red); border:1px solid #efc4c4; }
    button.act:disabled { opacity:.5; cursor:default; }
    .pc { display:flex; gap:14px; border:1px solid var(--line); border-radius:12px; padding:14px; }
    .pc img.cover { width:72px; height:72px; object-fit:cover; border-radius:10px; background:#eef1f5; flex:none; }
    .pc .info { flex:1; min-width:0; }
    .pc .pname { font-size:17px; font-weight:700; margin-bottom:2px; text-wrap:pretty; }
    .pc .pcat { color:var(--muted); font-size:13px; margin-bottom:8px; }
    .pc .summary { display:flex; align-items:center; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:13px; }
    .pc .summary .price-range { color:var(--red); font-weight:700; font-variant-numeric:tabular-nums; }
    .sku-line { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 0; border-top:1px dashed var(--line); }
    .sku-line .spec { color:var(--text); font-size:14px; }
    .sku-line .price { font-weight:700; color:var(--red); }
    .sku-line .price.none { color:var(--muted); font-weight:500; }
    .pc .btns { display:flex; flex-direction:column; gap:8px; flex:none; }
    .pc .btns button { white-space:nowrap; }
    .empty { text-align:center; color:var(--muted); padding:48px 10px; }
    .empty .big { font-size:40px; }
    .notice { display:none; margin:10px 0 0; padding:10px 14px; border-radius:10px; font-size:15px; word-break:break-all; overflow-wrap:anywhere; white-space:normal; }
    .notice.ok { display:block; background:#e2f5e9; color:var(--green); }
    .notice.err { display:block; background:#fdeaea; color:var(--red); }
    .hint { color:var(--muted); font-size:13px; }
    .login-shell { max-width:420px; margin:8vh auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
    .login-shell h1 { font-size:22px; margin:0 0 6px; }
    #overlay { display:none; position:fixed; inset:0; background:rgba(15,30,50,.45); z-index:50; align-items:flex-start; justify-content:center; padding:6vh 14px; }
    #overlay.is-open { display:flex; }
    .modal { background:#fff; border-radius:14px; width:100%; max-width:560px; max-height:84vh; overflow:auto; padding:20px; }
    .modal h3 { margin:0 0 10px; font-size:18px; }
    .modal .field { margin:12px 0; }
    .modal .field label { display:block; color:var(--muted); font-size:14px; margin-bottom:5px; }
    .modal .field input { width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; font-size:17px; }
    .modal .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
    .mgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:10px; margin-top:10px; }
    .mcell { border:2px solid var(--line); border-radius:10px; padding:6px; cursor:pointer; text-align:center; background:#fff; }
    .mcell.is-picked { border-color:var(--blue); background:#e3edfd; }
    .mcell img { width:100%; height:72px; object-fit:cover; border-radius:6px; background:#eef1f5; }
    .mcell .mname { font-size:12px; color:var(--muted); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sku-pick { width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; font-size:16px; }
    /* 顾客视角预览 */
    .pv-banner { border-radius:10px; padding:10px 14px; font-size:15px; font-weight:600; margin-bottom:12px; }
    .pv-banner.ok { background:#e2f5e9; color:var(--green); }
    .pv-banner.no { background:#fdeaea; color:var(--red); }
    .phone { width:100%; max-width:375px; margin:0 auto; border:10px solid #1c2b3a; border-radius:26px; background:#f7f9fc; overflow:hidden; }
    .phone .ptop { background:var(--blue); color:#fff; padding:10px 12px; font-size:14px; font-weight:600; }
    .phone .pchips { display:flex; gap:6px; padding:8px 10px; overflow-x:auto; background:#fff; border-bottom:1px solid var(--line); }
    .phone .pchips button { flex:none; border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; font-size:13px; color:var(--muted); }
    .phone .pchips button.is-active { background:var(--blue); border-color:var(--blue); color:#fff; }
    .phone .pbody { padding:10px; min-height:220px; max-height:430px; overflow-y:auto; }
    .pgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .pcell { background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; position:relative; }
    .pcell.is-target { outline:3px solid var(--blue); }
    .pcell img { width:100%; height:86px; object-fit:cover; border-radius:8px; background:#eef1f5; }
    .pcell .n { font-size:13px; font-weight:600; margin:6px 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pcell .p { color:var(--red); font-weight:700; font-size:14px; }
    .pcell .p.nologin { color:var(--muted); font-weight:500; font-size:12px; }
    .pcell .target-tag { position:absolute; top:6px; right:6px; background:var(--blue); color:#fff; font-size:11px; border-radius:6px; padding:2px 6px; }
    .pv-note { color:var(--muted); font-size:13px; margin-top:10px; text-align:center; }
    /* 商品页双栏：左编辑 / 右顾客实时视角 */
    .products-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(320px, 380px); gap:12px; align-items:start; }    .pright { position:sticky; top:70px; border:1px solid var(--line); border-radius:12px; padding:14px; background:#fbfdff; }
    .pane-head { font-weight:700; font-size:16px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
    .pane-head .sync { margin-left:auto; font-size:11px; color:var(--muted); font-weight:400; }
    .vchips { display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
    .vchips .vlabel { font-size:12px; color:var(--muted); }
    .vchips button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:4px 12px; font-size:12.5px; color:var(--muted); }
    .vchips button.is-active { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
    .pane-head .dot { width:9px; height:9px; border-radius:50%; background:var(--green); }
    .pane-head.is-syncing .dot { animation:pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .pright .phone { max-width:none; border-width:8px; }
    .narrow-only { display:none; }
    @media (max-width:900px) {
      .products-layout { grid-template-columns:1fr; }
      .pright { display:none; }
      .narrow-only { display:inline-block; }
    }
    /* 内联编辑 */
    .sku-line input { width:110px; padding:7px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
    /* 分页 */
    .pager { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 4px; color:var(--muted); font-size:13px; flex-wrap:wrap; }
    .pager .p-info { white-space:nowrap; }
    .pager .p-btns { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .pager button { padding:5px 11px; border:1px solid var(--line); background:#fff; border-radius:6px; color:var(--text); font-size:13px; }
    .pager button:hover:not(:disabled) { border-color:var(--blue); color:var(--blue); }
    .pager button.is-active { background:var(--blue); color:#fff; border-color:var(--blue); }
    .pager button:disabled { opacity:.45; cursor:default; }
    .pager .p-jump { display:flex; gap:4px; align-items:center; }
    .pager .p-jump input { width:44px; padding:3px 4px; border:1px solid var(--line); border-radius:5px; text-align:center; font-size:13px; }
    .sku-line.editing { flex-wrap:wrap; }
    .sku-edit { border:1px dashed var(--line); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:8px; }
    .sku-edit label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; }
    .sku-edit input { padding:8px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
    .sku-edit .row, .sku-edit .row2, .imgedit .row { display:flex; gap:8px; flex-wrap:wrap; }
    .sku-edit .row2 label { flex:1; min-width:110px; }
    .name-edit { display:flex; gap:6px; margin:2px 0 6px; }
    .name-edit input { flex:1; min-width:0; padding:7px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
    button.act.mini { padding:3px 8px; font-size:12px; font-weight:500; vertical-align:middle; }
    .imgedit { flex:1; }
    .imgstrip { display:flex; gap:8px; overflow-x:auto; padding:6px 0; }
    .imgstrip .mcell { flex:none; width:84px; }
    .imgstrip .mcell img { height:56px; }
    .upload-mini { position:relative; overflow:hidden; display:inline-flex; align-items:center; }
    .upload-mini input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; }
    .inline-note { font-size:12px; color:var(--muted); margin:6px 0 0; }
    .pcell.is-focus { outline:3px solid var(--blue); }
    .pcell .s { font-size:12px; color:var(--muted); margin:0 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* 商品编辑页：预览在左，表单在右 */
    .editor-layout { display:grid; grid-template-columns:minmax(340px, 402px) minmax(0,1fr); gap:12px; align-items:start; }
    .editor-layout .pright { position:sticky; top:70px; }
    /* 预览手机：宽度与手机端一致（375 视口），商品图和字加大 */
    .pright .phone { width:100%; max-width:395px; border-width:10px; border-radius:30px; margin:0 auto; }
    .pright .phone .ptop { padding:12px 14px; font-size:15px; }
    .pright .phone .pbody { max-height:600px; padding:12px; }
    .pgrid { gap:12px; }
    .pcell { padding:10px; }
    .pcell img { height:118px; }
    .pcell .n { font-size:15px; }
    .pcell .s { font-size:12.5px; margin-bottom:3px; }
    .pcell .p { font-size:16px; }
    .pcell .target-tag { font-size:12px; padding:3px 8px; }
    /* 详情页预览 */
    /* 详情页预览：按小程序真实详情页 1:1 还原（结构/文案/配色/字号取自 index.wxml 与 index.wxss，rpx 按 1:0.5 折算 px） */
    .pdetail { background:#f4f7fa; padding-bottom:10px; }
    .pdetail .detail-head { display:grid; align-items:center; height:46px; padding:0 10px; background:#fff; grid-template-columns:25px 1fr 25px; }
    .pdetail .detail-head button { font-size:23px; border:none; background:none; color:var(--text); padding:0; text-align:left; cursor:pointer; line-height:1; }
    .pdetail .detail-head .dt { text-align:center; font-size:14px; font-weight:700; }
    .pdetail .detail-product { display:flex; flex-direction:column; padding:11px 12px 12px; background:#fff; }
    .pdetail .detail-image { position:relative; display:flex; align-items:center; justify-content:center; height:195px; border-radius:4px; background:#f4f7fa; overflow:hidden; }
    .pdetail .detail-image img { width:100%; height:100%; object-fit:contain; }
    .pdetail .d-name { margin-top:11px; color:#182f49; font-size:17.5px; font-weight:700; line-height:1.35; }
    .pdetail .d-spec { margin-top:4px; color:#71859a; font-size:11px; line-height:1.45; }
    .pdetail .d-price-row { margin-top:6.5px; }
    .pdetail .d-price { color:#e65336; font-size:20px; font-weight:700; }
    .pdetail .d-price.is-locked { color:#6f8498; font-size:12px; font-weight:500; }
    .pdetail .detail-panel { margin-top:5.5px; padding:11.5px; background:#fff; }
    .pdetail .detail-line { display:flex; gap:10px; min-width:0; padding:6px 0; color:#1d354d; font-size:11px; }
    .pdetail .detail-line > span:first-child { width:46px; font-weight:700; flex:0 0 46px; }
    .pdetail .detail-line > span:last-child { min-width:0; color:#6e8297; line-height:1.5; overflow-wrap:anywhere; flex:1; }
    .pdetail .spec-list { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
    .pdetail .spec-list button { min-width:90px; min-height:34px; padding:6.5px 9px; border:1px solid #d7e2ec; border-radius:2.5px; color:#566c82; background:#fff; font-size:10.5px; }
    .pdetail .spec-list button.is-active { border-color:#0b69e9; color:#0b69e9; background:#edf5ff; }
    .pdetail .detail-quantity { display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:9px; border-top:1px solid #edf1f4; color:#1d354d; font-size:11px; font-weight:700; }
    .pdetail .detail-quantity-first { margin-top:0; padding-top:0; border-top:0; }
    .pdetail .detail-quantity.single-spec { margin-top:5.5px; padding:10px 11.5px; border-top:0; background:#fff; }
    .pdetail .qty { display:inline-flex; align-items:center; gap:8px; }
    .pdetail .qty button { width:24px; height:24px; border:1px solid #d7e2ec; background:#fff; border-radius:4px; font-size:14px; color:var(--text); line-height:1; }
    .pdetail .spec-flow-hint { margin-top:6px; color:#71859a; font-size:10.5px; }
    .pdetail .detail-title { display:block; margin-bottom:6px; font-size:13.5px; font-weight:700; }
    .pdetail .detail-note { color:#62788d; font-size:10.5px; line-height:1.6; }
    .pdetail .detail-video { display:block; width:100%; height:180px; border-radius:4px; background:#08131f; }
    .pdetail .detail-video-empty { display:flex; align-items:center; justify-content:center; flex-direction:column; min-height:90px; border-radius:4px; color:#657b90; background:#f5f8fb; font-size:11.5px; line-height:1.6; }
    .pdetail .detail-video-empty span:last-child { margin-top:3px; color:#91a1b1; font-size:10px; }
    .pdetail .d-loading { padding:12px; font-size:11px; color:var(--muted); }
    /* 详情模式：占满整个手机宽度 */
    .pgrid.is-detail { display:block; padding:0; }
    #editorTitle { margin:0 0 12px; font-size:20px; font-weight:800; }
    .form-section { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
    .form-section h3 { margin:0 0 10px; font-size:16px; display:flex; align-items:center; gap:8px; }
    .form-section .frow { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; align-items:flex-end; }
    .form-section .frow:last-child { margin-bottom:0; }
    .form-section label.f { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); flex:1; min-width:140px; }
    .form-section input, .form-section select { padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:15px; width:100%; }
    .spec-block { border:1px dashed var(--line); border-radius:10px; padding:10px; margin-bottom:10px; background:#fbfdff; }
    .spec-block.new { border-style:solid; background:#f4f8ff; }
    .spec-block .head { margin-bottom:8px; }
    .edhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
    @media (max-width:900px) {
      .editor-layout { grid-template-columns:1fr; }
      .editor-layout .pright { display:block; position:static; }
    }
    @media (max-width:720px) {
      .pc { flex-wrap:wrap; }
      .pc .btns { flex:1 1 100%; flex-direction:row; justify-content:flex-start; }
      .pc .cover { width:64px; height:64px; }
    }
  </style>
</head>
<body>
  <header class="top" id="topBar" style="display:none">
    <span class="brand">梦食鲜 · 简单后台</span>
    <span class="who" id="whoami"></span>
    <span class="spacer"></span>
    <a href="index.html">完整版</a>
    <button class="linkish" id="logoutBtn">退出</button>
  </header>

  <div class="login-shell" id="loginView">
    <h1>正在进入简单后台</h1>
    <p class="hint">管理员统一从完整版后台登录，登录成功后会自动返回这里。</p>
  </div>

  <div id="appView" style="display:none">
    <nav class="tabs" id="tabs">
      <button data-view="dashboard" class="is-active">今日待办</button>
      <button data-view="orders">订单处理</button>
      <button data-view="products">商品与价格</button>
      <button data-view="refunds">退款售后</button>
      <button data-view="inventory">库存</button>
    </nav>
    <main class="wrap">
      <p class="notice" id="notice" aria-live="polite"></p>

      <section class="view is-active" data-view="dashboard">
        <div class="stat-grid" id="statGrid"></div>
        <p class="hint" style="margin-top:14px">点上面的卡片可以直接跳到对应页面处理。</p>
      </section>

      <section class="view" data-view="orders">
        <div class="chips" id="orderChips"></div>
        <div class="card-list" id="orderList"></div>
      </section>

      <section class="view" data-view="products">
        <div class="toolbar">
          <input type="search" id="productSearch" placeholder="输入商品名或分类搜索…">
          <button class="refresh" id="productRefresh">刷新</button>
          <button class="act green" id="newProductBtn">+ 新增商品</button>
        </div>
        <p class="hint" style="margin:-6px 0 12px">点「修改」进入编辑页。修改会写入小程序与网页端共用的后端；商品是否可见还取决于上下架状态和面向客户。</p>
        <div class="card-list" id="productList"></div>
      </section>

      <section class="view" data-view="editor">
        <div class="edhead"><button class="act plain" id="backToProducts">‹ 返回商品列表</button><h2 id="editorTitle">修改商品</h2></div>
        <div class="editor-layout">
          <aside class="pright" id="editorPane">
            <div class="pane-head" id="livePaneHead"><span class="dot"></span>顾客视角模拟<span class="sync" id="liveSync"></span><button class="act plain mini" id="liveRefreshBtn">刷新数据</button></div>
            <div class="vchips" id="edViewerChips"><span class="vlabel">视角</span><button data-live-viewer="c" class="is-active">C 端（个人顾客）</button><button data-live-viewer="b">B 端（企业采购）</button></div>
            <div class="pv-banner" id="edBanner" style="background:#eef1f5;color:var(--muted)">正在整理后台最新数据…</div>
            <div class="phone">
              <div class="ptop">梦食鲜 · 冻品商城</div>
              <div class="pchips" id="edChips"></div>
              <div class="pbody"><div class="pgrid" id="edGrid"></div></div>
            </div>
            <p class="pv-note">这里用后台最新数据按服务端相同的 B/C 可见性和价格优先级进行模拟。保存成功表示数据已写入；最终展示仍以体验版中对应身份的真机结果为准。编辑页每 30 秒刷新一次数据。</p>
          </aside>
          <div id="editorForm"></div>
        </div>
      </section>

      <section class="view" data-view="refunds">
        <div class="toolbar"><button class="refresh" id="refundRefresh">刷新</button></div>
        <div class="card-list" id="refundList"></div>
      </section>

      <section class="view" data-view="inventory">
        <div class="toolbar">
          <input type="search" id="inventorySearch" placeholder="输入商品名搜索…">
          <button class="refresh" id="inventoryRefresh">刷新</button>
        </div>
        <div class="card-list" id="inventoryList"></div>
      </section>
    </main>
  </div>

  <div id="overlay"><div class="modal" id="modalBody"></div></div>

  <script src="https://static.cloudbase.net/cloudbase-js-sdk/3.9.2/cloudbase.full.js"></script>
  <script src="config.js"></script>
  <script src="api-client.js?v=20260911l"></script>
  <script src="paging.js?v=20260911a"></script>
  <script src="simple.js?v=20260911q"></script>
</body>
